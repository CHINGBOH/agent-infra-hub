name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same ref.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    name: Living docs drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout (skip vendored submodules / nested .git)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Show generator metadata
        run: |
          python3 --version
          python3 tools/docs_gen.py --help || true

      # `make docs-check` reroutes generated paths to a tempdir, regenerates,
      # and byte-compares against the committed copies. Any drift -> non-zero.
      - name: Verify committed generated docs are up to date
        run: make docs-check

      - name: Audit links (informational; docs-check already covers drift)
        if: always()
        run: |
          python3 tools/docs_gen.py links
          echo "----- link-report.md -----"
          sed -n '1,40p' docs/_generated/link-report.md

      - name: Audit catalog vs filesystem
        if: always()
        run: |
          python3 tools/docs_gen.py catalog
          echo "----- catalog-fs-report.md -----"
          sed -n '1,40p' docs/_generated/catalog-fs-report.md

      - name: Upload generated docs as artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-docs
          path: docs/_generated/
          retention-days: 7
